name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: npx playwright install --with-deps chromium
          - os: windows-latest
            browser: npx playwright install chromium
          - os: macos-latest
            browser: npx playwright install chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.browser }}
      - run: npm test
